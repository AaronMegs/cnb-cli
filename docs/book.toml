[book]
title = "cnb CLI Handbook"
authors = ["CNB CLI Authors"]
description = "Official handbook for the cnb command-line tool (cnb.cool)."
language = "zh-CN"
multilingual = false
src = "src"

[build]
build-dir = "../target/book"
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://cnb.cool/cnb/cli"
edit-url-template = "https://cnb.cool/cnb/cli/-/edit/main/docs/{path}"
mathjax-support = false
no-section-label = false
fold = { enable = true, level = 1 }

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1

[output.html.print]
enable = true
