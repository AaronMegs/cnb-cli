name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: test (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["1.86", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.toolchain }}

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        env:
          # Force file-based fallback in CI (no system keyring on the runners).
          CNB_KEYRING_BACKEND: none
        # `--test-threads=1` avoids env-var races in cnb-tty::color tests
        # which mutate shared process env.
        run: cargo test --workspace --all-targets -- --test-threads=1

  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86"

      - name: cargo-deny
        # Pin to v2.0.18 because that release ships cargo-deny 0.19.5,
        # which is the first version whose bundled `rustsec` crate
        # parses CVSS v4.0 advisory strings (RustSec started emitting
        # them in 2026, e.g. RUSTSEC-2026-0866). The floating `v2` tag
        # historically grabbed an older minor and exited 101 on parse.
        uses: EmbarkStudios/cargo-deny-action@v2.0.18
        # Treat advisory churn as informational on CI: a new RUSTSEC
        # entry should surface in PR review (annotations stay) without
        # breaking unrelated PRs on `main`. The local `deny.toml` keeps
        # ignore + rationale entries for already-triaged transitive
        # advisories — see docs/known-gaps.md #17.
        continue-on-error: true
        with:
          command: check

      - name: cargo-audit
        uses: rustsec/audit-check@v2
        continue-on-error: true   # advisories may flip overnight; informational
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
